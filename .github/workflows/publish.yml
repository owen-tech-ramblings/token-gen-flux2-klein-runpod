name: Publish private RunPod worker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CPU-only verification dependencies
        run: |
          python3 -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install pillow numpy

      - name: Verify FLUX 3 bootstrap and caption contract
        run: >-
          python3 -m unittest -v
          test_download_models.DownloadModelsTests.test_default_bootstrap_and_startup_use_native_precision
          test_flux3_caption.CaptionTests.test_native_caption_preserves_references_layout_and_explicit_bypass

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/owen-tech-ramblings/token-gen-flux2-klein-runpod
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
